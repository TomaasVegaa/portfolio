<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>App Delivery Premium Demo</title>
  <style>
    :root {
      --bg: #f9fafb;
      --card: #ffffff;
      --text: #111827;
      --text-muted: #6b7280;
      --primary: #f97316; /* Vibrant Orange */
      --primary-hover: #ea580c;
      --primary-light: #ffedd5;
      --danger: #ef4444;
      --border: #f3f4f6;
    }
    
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; background: #e5e7eb; color: var(--text); display: flex; justify-content: center; height: 100vh; overflow: hidden; }
    
    /* Mobile App Container */
    .app-container { width: 100%; max-width: 420px; background: var(--bg); height: 100%; position: relative; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,0.15); }
    @media (min-width: 420px) { .app-container { height: 95vh; margin-top: 2.5vh; border-radius: 30px; border: 6px solid #1f2937; } }
    
    /* Header */
    .header { background: var(--card); padding: max(1.5rem, env(safe-area-inset-top)) 1.25rem 1rem; display: flex; flex-direction: column; z-index: 10; border-bottom: 1px solid var(--border); }
    .logo-area { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.25rem; }
    .logo-area h1 { margin: 0; font-size: 1.35rem; font-weight: 800; color: var(--text); letter-spacing: -0.5px; }
    .logo-area h1 span { color: var(--primary); }
    
    .search-container { position: relative; }
    .search-icon { position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 1rem; }
    .search-bar { width: 100%; padding: 0.85rem 1rem 0.85rem 2.5rem; border: none; background: #f3f4f6; border-radius: 12px; font-size: 0.95rem; color: var(--text); outline: none; font-family: inherit; font-weight: 500; transition: background 0.2s; }
    .search-bar:focus { background: #e5e7eb; }
    
    /* Category Scroll */
    .categories { display: flex; overflow-x: auto; padding: 1rem 1.25rem; gap: 0.75rem; scrollbar-width: none; background: var(--bg); flex-shrink: 0; }
    .categories::-webkit-scrollbar { display: none; }
    .cat-btn { padding: 0.6rem 1.25rem; border-radius: 20px; border: none; background: var(--card); font-size: 0.9rem; font-weight: 600; cursor: pointer; white-space: nowrap; color: var(--text-muted); box-shadow: 0 2px 5px rgba(0,0,0,0.02); transition: all 0.2s; font-family: inherit; }
    .cat-btn.active { background: var(--primary); color: #fff; box-shadow: 0 4px 10px rgba(249, 115, 22, 0.3); }
    .category-chip { padding: 0.6rem 1.25rem; border-radius: 20px; border: 1px solid var(--border); background: var(--card); font-size: 0.9rem; font-weight: 600; cursor: pointer; white-space: nowrap; color: var(--text-muted); transition: all 0.2s; }
    .category-chip.active { background: var(--primary); border-color: var(--primary); color: #fff; box-shadow: 0 4px 10px rgba(249, 115, 22, 0.3); }
    
    /* Menu Items */
    .menu-list { flex: 1; overflow-y: auto; padding: 0 1.25rem; padding-bottom: 90px; }
    .menu-item { background: var(--card); border-radius: 16px; display: flex; margin-bottom: 1rem; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.03); transition: transform 0.2s; padding: 0.75rem; gap: 1rem; align-items: center; }
    .menu-item:active { transform: scale(0.98); }
    
    .item-img {
      width: 100px;
      height: 100px;
      border-radius: 12px;
      object-fit: cover;
      flex-shrink: 0;
      background: var(--bg);
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    }
    
    .item-details { flex: 1; display: flex; flex-direction: column; justify-content: center; }
    .item-name { font-weight: 700; font-size: 1.05rem; margin-bottom: 0.25rem; letter-spacing: -0.3px; }
    .item-desc { font-size: 0.8rem; color: var(--text-muted); line-height: 1.3; margin-bottom: 0.5rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    
    .item-price-row { display: flex; justify-content: space-between; align-items: center; margin-top: 0.25rem; }
    .item-price { font-weight: 800; font-size: 1.1rem; color: var(--text); }
    .add-btn { background: var(--primary); border: none; color: white; width: 34px; height: 34px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 1.4rem; cursor: pointer; box-shadow: 0 2px 6px rgba(249, 115, 22, 0.3); }
    
    /* Floating Cart */
    .floating-cart { position: absolute; bottom: 1.25rem; left: 1.25rem; right: 1.25rem; background: var(--text); border-radius: 16px; padding: 1rem 1.25rem; display: flex; justify-content: space-between; align-items: center; color: white; cursor: pointer; box-shadow: 0 10px 25px rgba(0,0,0,0.2); transform: translateY(150%); transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 20; }
    .floating-cart.visible { transform: translateY(0); }
    .cart-info { display: flex; align-items: center; gap: 1rem; }
    .cart-badge { background: var(--primary); color: white; width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 0.95rem; }
    .cart-text { font-weight: 600; font-size: 1rem; }
    .cart-total { font-weight: 800; font-size: 1.15rem; }
    
    /* Cart Modal */
    .cart-modal { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 30; display: flex; flex-direction: column; transform: translateX(100%); transition: transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1); }
    .cart-modal.open { transform: translateX(0); }
    
    .cart-modal-header { padding: max(1.5rem, env(safe-area-inset-top)) 1.25rem 1rem; background: var(--card); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
    .back-btn { background: #f3f4f6; border: none; width: 40px; height: 40px; border-radius: 50%; font-size: 1.2rem; cursor: pointer; color: var(--text); display: flex; align-items: center; justify-content: center; }
    .cart-modal-title { font-size: 1.2rem; font-weight: 800; margin: 0; }
    .clear-btn { background: none; border: none; color: var(--danger); font-weight: 600; font-size: 0.9rem; cursor: pointer; }
    
    .cart-modal-body { flex: 1; padding: 1.25rem; overflow-y: auto; }
    .cart-summary-item { display: flex; justify-content: space-between; align-items: center; padding: 1.25rem 0; border-bottom: 1px solid var(--border); }
    .cart-summary-info { display: flex; flex-direction: column; gap: 0.25rem; }
    .cart-summary-name { font-weight: 700; font-size: 1rem; color: var(--text); }
    .cart-summary-actions { display: flex; align-items: center; gap: 0.75rem; margin-top: 0.5rem; }
    .qty-btn { width: 28px; height: 28px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 1.1rem; color: var(--text); cursor: pointer; }
    .qty-text { font-weight: 700; font-size: 0.95rem; width: 20px; text-align: center; }
    
    .cart-summary-price { font-weight: 800; font-size: 1.1rem; color: var(--text); }
    
    .cart-modal-footer { padding: 1.25rem; background: var(--card); border-top: 1px solid var(--border); padding-bottom: max(1.25rem, env(safe-area-inset-bottom)); box-shadow: 0 -4px 15px rgba(0,0,0,0.03); }
    .modal-total-row { display: flex; justify-content: space-between; font-weight: 800; font-size: 1.3rem; margin-bottom: 1.25rem; }
    .whatsapp-btn { width: 100%; background: #25D366; color: white; border: none; padding: 1.1rem; border-radius: 14px; font-weight: 800; font-size: 1.1rem; display: flex; align-items: center; justify-content: center; gap: 0.5rem; cursor: pointer; box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3); transition: transform 0.1s; }
    .whatsapp-btn:active { transform: scale(0.98); }
    
  </style>
</head>
<body>

  <div class="app-container">
    <div class="header">
      <div class="logo-area">
        <h1>Demo<span>Delivery</span></h1>
        <img src="https://img.icons8.com/color/96/000000/hamburger.png" style="width: 40px; height: 40px;" alt="Logo">
      </div>
      <div class="search-container">
        <span class="search-icon">🔍</span>
        <input type="text" class="search-bar" placeholder="¿Qué se te antoja hoy?">
      </div>
    </div>
    
    <div class="categories">
      <div class="category-chip active">Hamburguesas</div>
      <div class="category-chip">Pizzas</div>
      <div class="category-chip">Papas & Snacks</div>
      <div class="category-chip">Bebidas</div>
    </div>
    
    <div class="menu-list" id="menuList">
      <!-- Generado por JS -->
    </div>
    
    <div class="floating-cart" id="floatingCart" onclick="openCart()">
      <div class="cart-info">
        <div class="cart-badge" id="cartBadge">0</div>
        <span class="cart-text">Ver tu Pedido</span>
      </div>
      <div class="cart-total" id="floatingTotal">$0</div>
    </div>
    
    <!-- Cart Modal -->
    <div class="cart-modal" id="cartModal">
      <div class="cart-modal-header">
        <button class="back-btn" onclick="closeCart()">←</button>
        <h2 class="cart-modal-title">Tu Pedido</h2>
        <button class="clear-btn" onclick="clearCart()">Vaciar</button>
      </div>
      <div class="cart-modal-body" id="cartModalBody">
        <!-- Generado por JS -->
      </div>
      <div class="cart-modal-footer">
        <div class="modal-total-row">
          <span>DemoDelivery</span>
          <span id="modalTotal">$0</span>
        </div>
        <button class="whatsapp-btn" onclick="sendWhatsApp()">
          <span style="font-size: 1.3rem;">💬</span> Enviar por WhatsApp
        </button>
      </div>
    </div>
  </div>

  <script>
    const menu = [
      { id: 1, name: "Doble Bacon Cheddar", desc: "Doble medallón 150g, cuádruple cheddar, bacon crujiente y cebolla crispy.", price: 6500, img: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=300&q=80" },
      { id: 2, name: "Classic Cheese", desc: "Medallón 150g, queso cheddar, lechuga, tomate y salsa especial de la casa.", price: 4800, img: "https://images.unsplash.com/photo-1586190848861-99aa4a171e90?auto=format&fit=crop&w=300&q=80" },
      { id: 3, name: "Crispy Chicken Spicy", desc: "Pollo frito extra crispy, coleslaw picante y salsa mayo-siracha.", price: 5200, img: "https://images.unsplash.com/photo-1626082927389-6cd097cdc6ec?auto=format&fit=crop&w=300&q=80" },
      { id: 4, name: "Veggie NotBurger", desc: "Medallón plant-based, queso vegano, rúcula y tomate confitado.", price: 5800, img: "https://images.unsplash.com/photo-1520072959219-c595dc870360?auto=format&fit=crop&w=300&q=80" },
      { id: 5, name: "Papas Cheddar & Bacon", desc: "Porción grande de papas fritas bañadas en cheddar fundido y bacon picado.", price: 3500, img: "https://images.unsplash.com/photo-1576107232684-1279f390859f?auto=format&fit=crop&w=300&q=80" },
      { id: 6, name: "Aros de Cebolla", desc: "Aros de cebolla rebozados con salsa barbacoa (10 un).", price: 2800, img: "https://images.unsplash.com/photo-1639024471283-03518883512d?auto=format&fit=crop&w=300&q=80" }
    ];

    let cart = [];

    function renderMenu() {
      const list = document.getElementById('menuList');
      list.innerHTML = menu.map(item => `
        <div class="menu-item">
          <img src="${item.img}" alt="${item.name}" class="item-img" loading="lazy">
          <div class="item-details">
            <div class="item-name">${item.name}</div>
            <div class="item-desc">${item.desc}</div>
            <div class="item-price-row">
              <span class="item-price">$${item.price.toLocaleString('es-AR')}</span>
              <button class="add-btn" onclick="addToCart(${item.id})">+</button>
            </div>
          </div>
        </div>
      `).join('');
    }

    function addToCart(id) {
      const item = menu.find(m => m.id === id);
      const existing = cart.find(c => c.id === id);
      
      if (existing) {
        existing.qty++;
      } else {
        cart.push({ ...item, qty: 1 });
      }
      
      updateCartUI();
      
      // Animate cart button
      const floatingCart = document.getElementById('floatingCart');
      floatingCart.style.transform = 'translateY(-8px)';
      setTimeout(() => floatingCart.style.transform = 'translateY(0)', 150);
    }

    function changeQty(id, delta) {
      const existing = cart.find(c => c.id === id);
      if (!existing) return;
      
      existing.qty += delta;
      if (existing.qty <= 0) {
        cart = cart.filter(c => c.id !== id);
      }
      
      updateCartUI();
      
      if (cart.length === 0) {
        closeCart();
      } else {
        renderCartItems(); // Re-render if cart is open
      }
    }

    function clearCart() {
      cart = [];
      updateCartUI();
      closeCart();
    }

    function updateCartUI() {
      const floatingCart = document.getElementById('floatingCart');
      const badge = document.getElementById('cartBadge');
      const floatTotal = document.getElementById('floatingTotal');
      
      const totalQty = cart.reduce((acc, item) => acc + item.qty, 0);
      const totalPrice = cart.reduce((acc, item) => acc + (item.price * item.qty), 0);
      
      if (totalQty > 0) {
        floatingCart.classList.add('visible');
        badge.textContent = totalQty;
        floatTotal.textContent = `$${totalPrice.toLocaleString('es-AR')}`;
      } else {
        floatingCart.classList.remove('visible');
      }
    }

    function openCart() {
      const modal = document.getElementById('cartModal');
      modal.classList.add('open');
      renderCartItems();
    }

    function renderCartItems() {
      const body = document.getElementById('cartModalBody');
      const modalTotal = document.getElementById('modalTotal');
      
      if (cart.length === 0) {
        body.innerHTML = `<div style="text-align:center; padding: 3rem 0; color: var(--text-muted); font-size: 1.1rem; font-weight: 500;">Tu carrito está vacío</div>`;
        modalTotal.textContent = "$0";
        return;
      }
      
      body.innerHTML = cart.map(item => `
        <div class="cart-summary-item">
          <div class="cart-summary-info">
            <span class="cart-summary-name">${item.name}</span>
            <div class="cart-summary-actions">
              <button class="qty-btn" onclick="changeQty(${item.id}, -1)">-</button>
              <span class="qty-text">${item.qty}</span>
              <button class="qty-btn" onclick="changeQty(${item.id}, 1)">+</button>
            </div>
          </div>
          <span class="cart-summary-price">$${(item.price * item.qty).toLocaleString('es-AR')}</span>
        </div>
      `).join('');
      
      const totalPrice = cart.reduce((acc, item) => acc + (item.price * item.qty), 0);
      modalTotal.textContent = `$${totalPrice.toLocaleString('es-AR')}`;
    }

    function closeCart() {
      document.getElementById('cartModal').classList.remove('open');
    }

    function sendWhatsApp() {
      alert("En el sistema real, la orden se envía instantáneamente al comercio por WhatsApp ✅.");
      clearCart();
    }

    renderMenu();
  </script>
</body>
</html>
